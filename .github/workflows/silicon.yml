# Kit template (templates/signoff/pnr/silicon.yml): copy to .github/workflows/silicon.yml.
# PRIVATE repos: Actions minutes are billed; drop the pull_request/push triggers and
# keep workflow_dispatch only.
# sky130 silicon run (tapeout-readiness T2/T6): RTL-to-GDS with LibreLane, the
# OpenLane successor. Per top: synthesis, floorplan, PDN, placement, CTS, routing,
# extraction, multi-corner STA against the repo SDC, DRC, LVS, and
# area/power (summary: syn/pnr/reports/<top>.pnr.rpt, syn/pnr/summarize.py); then
# functional GLS of the routed netlist with the sky130 cell models
# (syn/pnr/gls_sky130.sh -> syn/pnr/reports/<top>.gls.rpt).
#
# Heavy (Docker + PDK download + P&R), so it runs on demand (Actions → silicon →
# Run workflow) or when a change touches the RTL or the physical-design inputs.
name: silicon

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'build.sbt'
      - 'project/**'
      - 'syn/constraints/**'
      - 'syn/pnr/**'
      - '.github/workflows/silicon.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.sbt'
      - 'project/**'
      - 'syn/constraints/**'
      - 'syn/pnr/**'
      - '.github/workflows/silicon.yml'

permissions:
  contents: read

concurrency:
  group: silicon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnr:
    name: sky130 ${{ matrix.top }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        top: [TLUHToAXI4, TLULToAXILite, TLUCToAXI4]
    steps:
      - uses: actions/checkout@v4

      # Chisel IP: the RTL LibreLane reads is the emitted SV (git-ignored build output).
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Elaborate Chisel -> SV (make elab)
        run: make elab && ls -la generated/TLUHToAXI4.sv generated/ulite/TLULToAXILite.sv generated/uc/TLUCToAXI4.sv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LibreLane
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade librelane
          python3 -m librelane --version

      - name: Cache the sky130 PDK (ciel)
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-sky130-${{ runner.os }}-librelane-${{ hashFiles('.github/workflows/silicon.yml') }}

      - name: RTL-to-GDS (LibreLane Classic flow, dockerized)
        id: pnr
        run: bash syn/pnr/run_pnr.sh ${{ matrix.top }}

      # Post-route GLS is NOT run for this repo (n/a, not a pass): the self-checking TBs
      # are C++ Verilator harnesses, and Verilator cannot simulate the sky130_fd_sc_hd cell
      # models (UDP primitives). See syn/gls/T6_PLAN.md.

      - name: Upload GDS, netlists, SDF/SPEF, reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky130-${{ matrix.top }}
          path: |
            syn/pnr/reports/${{ matrix.top }}.*
            syn/pnr/${{ matrix.top }}/runs/ci/final/
            syn/pnr/${{ matrix.top }}/runs/ci/resolved.json
            syn/pnr/${{ matrix.top }}/runs/ci/flow.log
            syn/pnr/${{ matrix.top }}/runs/ci/*/*.log
            syn/pnr/${{ matrix.top }}/runs/ci/*-openroad-stapostpnr/**/*.rpt
          if-no-files-found: warn
