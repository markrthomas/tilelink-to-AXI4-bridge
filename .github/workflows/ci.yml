name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Shared step: install JDK + sbt so `make elab` (and anything depending on
# generated/TLUHToAXI4.sv) can run.  Each job that needs the elaborated SV
# repeats it because GitHub Actions doesn't share filesystem state across
# jobs without artifact upload/download.
#
# DV_STANDARDS-style job layout (one job per Makefile target the table
# tracks).  `regress` is the blocking fast-gate; everything else depends
# on it so failures surface together.

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: sbt/setup-sbt@v1
      - name: Install verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Lint + directed simulation (make regress)
        run: make regress

  coverage:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: sbt/setup-sbt@v1
      - name: Install verilator + lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator lcov
      - name: Verilator coverage (make coverage)
        run: make coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage.info
          if-no-files-found: error

  cocotb:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: sbt/setup-sbt@v1
      - name: Install icarus + cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python3 -m pip install --user 'cocotb==1.8.1'
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: cocotb directed tests (make cocotb)
        run: make cocotb

  formal:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: sbt/setup-sbt@v1
      - name: Install OSS CAD Suite (SymbiYosys + Yosys + solvers)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}   # authenticated release lookup: avoids the shared-IP API rate limit
          # Pin to a known-good build: the unpinned latest nightly ships
          # Verilator 5.049, which ICEs on TLCToCHI.sv (SEL AstNode crash
          # under --coverage).  2026-04-13 ships the working Verilator 5.047.
          version: '2026-04-13'
      - name: BMC + cover (make formal)
        run: make formal

  # TL-C → CHI bridge — full surface in one job (lint + directed +
  # randomized sim via regress-chi, BMC depth 30 + cover, cocotb,
  # coverage), parallel to the four jobs above.
  chi:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: sbt/setup-sbt@v1
      - name: Install verilator + icarus + cocotb + lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog lcov
          python3 -m pip install --user 'cocotb==1.8.1'
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install OSS CAD Suite (SymbiYosys + Yosys + solvers)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}   # authenticated release lookup: avoids the shared-IP API rate limit
          # Pin to a known-good build.  This suite's Verilator (5.047)
          # shadows the apt one on PATH and is what coverage-chi actually
          # uses; the unpinned nightly's 5.049 ICEs under --coverage.
          version: '2026-04-13'
      - name: Lint + directed + randomized simulation (make regress-chi)
        run: make regress-chi
      - name: BMC depth 30 + cover (make formal-chi)
        run: make formal-chi
      - name: cocotb tests (make cocotb-chi)
        run: make cocotb-chi
      - name: Coverage (make coverage-chi)
        run: make coverage-chi

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Install OSS CAD Suite (Yosys + tclsh) — matches the formal/chi jobs
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}   # authenticated release lookup: avoids the shared-IP API rate limit
          version: '2026-04-13'
      - name: T1 synthesizability gate (elab + synth, make syn)
        run: make syn
      - name: T4 DFT scan-readiness audit (latch-free + no comb loops + flop inventory)
        run: make dft
      - name: T3 low-power UPF consistency lint
        run: make lp
      - name: T6 PPA proxy baseline (per top; cells / flops / logic-depth)
        run: make ppa
      - name: T7 packaging — IP-XACT well-formed + structural + port-sync with SV
        run: |
          command -v xmllint >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libxml2-utils; }
          make pkg
      - name: Restore the IEEE 1685-2014 schema mirror (fixed standard)
        uses: actions/cache/restore@v4
        with:
          path: .cache/ipxact-1685-2014
          key: ipxact-1685-2014-xsd-v3-${{ hashFiles('pkg/ip-xact/schema/ieee-1685-2014.sha256') }}
      - name: T7 IP-XACT full XSD validation (IEEE 1685-2014; Accellera, eda.org or pinned GitHub copy)
        run: make pkg-xsd XSD_HOST_OPTIONAL=1
      - name: Save the schema mirror (only once it is complete)
        if: always() && hashFiles('.cache/ipxact-1685-2014/.complete') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/ipxact-1685-2014
          key: ipxact-1685-2014-xsd-v3-${{ hashFiles('pkg/ip-xact/schema/ieee-1685-2014.sha256') }}
        continue-on-error: true   # key already saved by another run
      - name: T7 release bundle dry run (reproducible build + manifest verify; T0 open, so not publishable)
        run: |
          make release-check
          mkdir -p dist && cp /tmp/rel-a/* dist/
      - name: Upload release bundle (CI dry-run build, version 0.0.0-ci)
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-dryrun
          path: dist/
          if-no-files-found: error
      - name: Upload DFT scan-readiness reports
        uses: actions/upload-artifact@v4
        with:
          name: dft-reports
          path: syn/dft/reports/
          if-no-files-found: ignore
      - name: Upload T6 PPA reports
        uses: actions/upload-artifact@v4
        with:
          name: t6-ppa-reports
          path: syn/ppa/reports/
          if-no-files-found: ignore
