name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Shared step: install JDK + sbt so `make elab` (and anything depending on
# generated/TLUHToAXI4.sv) can run.  Each job that needs the elaborated SV
# repeats it because GitHub Actions doesn't share filesystem state across
# jobs without artifact upload/download.
#
# DV_STANDARDS-style job layout (one job per Makefile target the table
# tracks).  `regress` is the blocking fast-gate; everything else depends
# on it so failures surface together.

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: sbt/setup-sbt@v1
      - name: Install verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Lint + directed simulation (make regress)
        run: make regress

  coverage:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: sbt/setup-sbt@v1
      - name: Install verilator + lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator lcov
      - name: Verilator coverage (make coverage)
        run: make coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage.info
          if-no-files-found: error

  cocotb:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: sbt/setup-sbt@v1
      - name: Install icarus + cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python3 -m pip install --user 'cocotb==1.8.1'
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: cocotb directed tests (make cocotb)
        run: make cocotb

  formal:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: sbt/setup-sbt@v1
      - name: Install OSS CAD Suite (SymbiYosys + Yosys + solvers)
        uses: YosysHQ/setup-oss-cad-suite@v3
      - name: BMC + cover (make formal)
        run: make formal

  # TL-C → CHI bridge — full surface in one job (lint + directed +
  # randomized sim via regress-chi, BMC depth 30 + cover, cocotb,
  # coverage), parallel to the four jobs above.
  chi:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: sbt/setup-sbt@v1
      - name: Install verilator + icarus + cocotb + lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog lcov
          python3 -m pip install --user 'cocotb==1.8.1'
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install OSS CAD Suite (SymbiYosys + Yosys + solvers)
        uses: YosysHQ/setup-oss-cad-suite@v3
      - name: Lint + directed + randomized simulation (make regress-chi)
        run: make regress-chi
      - name: BMC depth 30 + cover (make formal-chi)
        run: make formal-chi
      - name: cocotb tests (make cocotb-chi)
        run: make cocotb-chi
      - name: Coverage (make coverage-chi)
        run: make coverage-chi
